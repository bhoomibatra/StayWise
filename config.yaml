project:
  name: StayWise
  version: "1.0"
  description: "Explainable Customer Churn Prediction & Decision-Support System"

paths:
  raw_data: "data/raw/WA_Fn-UseC_-Telco-Customer-Churn.csv"
  processed_data: "data/processed/"
  models_dir: "models/"
  reports_dir: "reports/"
  best_pipeline: "models/best_pipeline.joblib"
  model_comparison: "reports/model_comparison.csv"

data:
  target_column: "Churn"
  id_column: "customerID"
  random_state: 42
  test_size: 0.20
  val_size: 0.20   # fraction of (train+val) used for validation
  cv_folds: 5

models:
  logistic_regression:
    C: 1.0
    max_iter: 1000
    class_weight: "balanced"
    solver: "lbfgs"
  decision_tree:
    criterion: "entropy"
    max_depth: 8
    class_weight: "balanced"
    random_state: 42
  random_forest:
    n_estimators: 300
    class_weight: "balanced"
    random_state: 42
    n_jobs: -1
  xgboost:
    n_estimators: 300
    learning_rate: 0.05
    max_depth: 6
    random_state: 42
    eval_metric: "aucpr"
    use_label_encoder: false

training:
  selection_metric: "pr_auc"   # metric used to pick best model
  calibration_method: "isotonic"

business:
  offer_cost: 50.0             # USD cost of a retention offer
  success_rate: 0.30           # probability the offer retains the customer
  currency_symbol: "$"
  currency_conversion: 1.0     # multiply MonthlyCharges by this factor
  max_remaining_months: 24     # cap on expected remaining lifetime
  threshold_default: 0.5       # default classification threshold

risk_categories:
  low:      [0.0, 0.25]
  medium:   [0.25, 0.60]
  high:     [0.60, 0.80]
  critical: [0.80, 1.01]
